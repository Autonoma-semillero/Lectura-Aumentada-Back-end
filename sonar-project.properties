# SonarCloud — Lectura Aumentada Backend
#
# projectKey y organization los genera SonarCloud al importar el repositorio
# desde GitHub. Si en sonarcloud.io aparecen con otro valor, corregir aquí.
sonar.projectKey=Autonoma-semillero_Lectura-Aumentada-Back-end
sonar.organization=autonoma-semillero
sonar.projectName=Lectura Aumentada Backend

sonar.sources=src
sonar.tests=src,test
# Todo lo de test/ es apoyo de pruebas (incluye jest-e2e.setup.ts), y en src/
# los *.spec.ts conviven con el código al que prueban (jest.config.js usa
# rootDir: src).
sonar.test.inclusions=src/**/*.spec.ts,test/**/*.ts
sonar.sourceEncoding=UTF-8

# Cobertura de `npm run test:cov` (jest escribe coverage/lcov.info con rutas
# relativas a la raíz del repositorio).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Fuera del análisis:
# - node_modules está versionado en este repositorio y no es código propio.
# - dist es salida de compilación.
# - los DTO y los *.module.ts ya están excluidos de cobertura en jest.config.js;
#   se excluyen también de la métrica de Sonar para que ambas coincidan.
sonar.exclusions=node_modules/**,dist/**,coverage/**,db/**,docs/**,scripts/**
sonar.coverage.exclusions=**/*.spec.ts,test/**,**/*.module.ts,src/main.ts,**/dto/**
